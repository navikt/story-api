apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: story-api-proxy
  name: story-api-proxy
  namespace: datastories
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: story-api-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: story-api-proxy
      name: story-api-proxy
    spec:
      serviceAccountName: story-api-proxy
      containers:
      - name: story-api-proxy
        env:
        - name: HOST
          value: datamarkedsplassen.intern.nav.no
        image: artifacts.data.nav.no/dataplattform-infra/story-api-proxy:manuell
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1069
          runAsNonRoot: true
          runAsUser: 1069
          seccompProfile:
            type: RuntimeDefault
