apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: story-api-proxy
  namespace: datastories
spec:
  hostnames:
  - <replace>
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: panda-external-gateway
    namespace: gateway
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: story-api-proxy
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /quarto
