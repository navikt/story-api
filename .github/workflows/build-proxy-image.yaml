name: Build, push, and deploy

on:
  push:
    branches:
      - main

permissions:
 contents: write
 packages: write

jobs:
  build:
    name: Build and push Docker container
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
    - uses: actions/checkout@v7

    - uses: docker/login-action@v4
      name: Login to GitHub Container Registry
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create image tag
      id: image_tag
      run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

    - uses: docker/build-push-action@v7
      with:
        file: Dockerfile.proxy
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}

    - name: Update kustomization.yaml with new image tag
      working-directory: deploy/base
      run: |
        kustomize edit set image artifacts.data.nav.no/ghcr/${{ github.repository }}=artifacts.data.nav.no/ghcr/${{ github.repository }}:${{ env.IMAGE_TAG }}
    
        git config --global user.name ${{ github.actor }}
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git add kustomization.yaml
        git commit -m "Update image tag to ${{ env.IMAGE_TAG }}"
        git push
