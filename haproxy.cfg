global
    maxconn 256

defaults
    mode http
    timeout connect 4000ms
    timeout client 10000ms
    timeout server 10000ms

listen http-in
    bind *:8080

    acl is_get method GET
    acl is_health_path path -m str /quarto/health
    http-request return status 200 content-type "text/plain" string "OK" if is_get is_health_path

    http-request set-header Host "$HOST"

    server server "$HOST":443 ssl verify required ca-file /etc/ssl/cert.pem sni req.hdr(Host)
